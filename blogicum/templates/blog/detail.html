{% extends 'base.html' %}
{% block title %}{{ post.location }} - {{ post.date }}{% endblock %}
{% block content %}
<div class="container py-5">
  <h1>{{ post.location }}</h1>
  <p>Дата: {{ post.date }}</p>
  <p>Категория: <a href="{% url 'blog:category_posts' post.category %}">{{ post.category }}</a></p>
  <hr>
  <p>{{ post.text }}</p>
  <a href="{% url 'blog:index' %}">Вернуться к ленте</a>
</div>
{% endblock %}
